<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1c2430">
<title>Permintaan Pimpinan — Simulasi Analisis Data Administrasi</title>
<style>
  :root{
    --ink: #1c2430;
    --ink-2: #2a3444;
    --paper: #f2ead8;
    --paper-2: #e8dcc0;
    --gold: #c9982f;
    --gold-2: #e3b94f;
    --forest: #4f7a56;
    --forest-2: #6fa377;
    --crimson: #a13c3c;
    --crimson-2: #c25858;
    --ink-soft: #566073;
    --serif: 'Spectral', 'Iowan Old Style', 'Georgia', serif;
    --data: 'Courier New', ui-monospace, monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html{
    scroll-padding-top: env(safe-area-inset-top, 0px);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  html,body{
    margin:0; padding:0; min-height:100%;
    background: radial-gradient(ellipse at top, #26314540, transparent 60%), var(--ink);
    color: var(--paper);
    font-family: var(--serif);
    overscroll-behavior-y: contain;
  }
  #app{
    max-width: 900px;
    margin: 0 auto;
    min-height: 100vh;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 18px calc(60px + env(safe-area-inset-bottom, 0px));
    display:flex;
    flex-direction:column;
  }
  .journal{
    background: var(--paper);
    color: var(--ink);
    border-radius: 4px;
    box-shadow: 0 0 0 1px #00000030, 0 20px 50px -20px #000a;
    position: relative;
    overflow:hidden;
    flex:1;
    display:flex;
    flex-direction:column;
  }
  .journal::before{
    content:"";
    position:absolute; inset:0;
    background:
      linear-gradient(90deg, #00000010 0, transparent 14px),
      repeating-linear-gradient(#00000000 0 34px, #00000009 34px 35px);
    pointer-events:none;
  }
  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    padding: 14px 22px;
    background: var(--ink-2);
    color: var(--paper);
    border-bottom: 3px solid var(--gold);
    gap: 14px;
    flex-wrap: wrap;
  }
  .topbar .brand{ font-size: 0.95rem; letter-spacing: 0.03em; color: var(--gold-2); }
  .topbar .brand b{ color: var(--paper); font-weight:700; }
  .stat-strip{ display:flex; gap:18px; font-size:0.85rem; }
  .hpwrap{ width:130px; }
  .barlabel{ font-size:0.68rem; letter-spacing:0.04em; margin-bottom:2px; opacity:0.85;}
  .barouter{ height:9px; border-radius:5px; background:#0004; overflow:hidden; box-shadow: inset 0 0 0 1px #ffffff22; }
  .barinner{ height:100%; transition: width .5s ease; }
  .barinner.energi{ background: linear-gradient(90deg, var(--crimson), var(--crimson-2)); }
  .barinner.trust{ background: linear-gradient(90deg, #b8862c, var(--gold-2)); }
  .barinner.exp{ background: linear-gradient(90deg, var(--forest), var(--forest-2)); }

  .stage{ flex:1; padding: 30px 34px 20px; position: relative; z-index:1; display:flex; flex-direction:column; gap:16px; }
  h1{ font-size:1.55rem; margin:0 0 4px; font-weight:700; }
  h2{ font-size:1.12rem; margin:0 0 6px; color: var(--ink-2); font-weight:700;}
  p{ line-height:1.55; margin:0 0 10px; }
  .lede{ color: var(--ink-soft); font-size:0.95rem; }
  .rule{ border:none; border-top:1px solid #00000022; margin: 6px 0 4px; }
  .chip{ display:inline-block; font-size:0.72rem; padding: 3px 10px; border-radius: 999px; background: var(--ink-2); color: var(--gold-2); letter-spacing:0.02em; margin-bottom: 6px; }

  .btn{
    font-family: var(--serif); font-size: 1rem; padding: 12px 22px; min-height: 44px;
    border-radius: 3px; border: 1.5px solid var(--ink-2); background: var(--ink-2); color: var(--paper);
    cursor: pointer; touch-action: manipulation; transition: transform .12s ease, background .15s ease;
  }
  .btn:hover{ background: var(--ink); transform: translateY(-1px); }
  .btn:active{ transform: translateY(0); }
  .btn.secondary{ background: transparent; color: var(--ink-2); }
  .btn.secondary:hover{ background:#00000010; }

  input[type=text]{
    font-family: var(--serif); font-size: 1.05rem; padding: 11px 14px; border-radius: 3px;
    border: 1.5px solid #00000040; background: #fffdf6; color: var(--ink); width: 100%; max-width: 320px;
  }

  .scene-desk{ background: var(--paper-2); border: 1px solid #00000020; border-radius: 4px; padding: 18px 20px; overflow-x:auto; }
  .data-table{ width:100%; border-collapse: collapse; margin: 10px 0 4px; font-family: var(--data); font-size: 0.82rem; }
  .data-table th, .data-table td{ border: 1px solid #00000030; padding: 6px 8px; text-align:right; white-space:nowrap; }
  .data-table th{ background: var(--ink-2); color: var(--gold-2); text-align:center; font-family: var(--serif);}
  .data-table td:first-child, .data-table th:first-child{ text-align:left; }

  .boss-card{
    display:flex; align-items:center; gap:16px;
    background: linear-gradient(135deg, #2a2140, #3a2c56);
    color: var(--paper); border-radius: 4px; padding: 16px 18px; margin-bottom: 4px;
  }
  .boss-sigil{
    width:54px; height:54px; flex:none; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #9a6fd0, #4a3070);
    display:flex; align-items:center; justify-content:center; font-size:1.5rem;
    box-shadow: 0 0 0 3px #ffffff20;
  }
  .boss-name{ font-weight:700; font-size:1.05rem; }
  .boss-title{ font-size:0.78rem; opacity:0.75; }
  .memo{
    background: #fffdf6; border-left: 4px solid var(--gold); padding: 12px 16px;
    font-style: italic; color: var(--ink-2); border-radius: 2px;
  }

  .qcount{ font-size:0.78rem; color: var(--ink-soft); }
  .options{ display:flex; flex-direction:column; gap:9px; margin-top:6px; }
  .opt{
    text-align:left; font-family: var(--serif); font-size:0.98rem; padding: 13px 15px; min-height: 46px;
    border-radius:3px; border: 1.5px solid #00000030; background: #fffdf6; color: var(--ink);
    cursor:pointer; touch-action: manipulation; transition: background .12s ease, border-color .12s ease;
  }
  .opt:hover{ border-color: var(--ink-2); }
  .opt.correct{ background: #dcead9; border-color: var(--forest); }
  .opt.wrong{ background: #f2d9d9; border-color: var(--crimson); }
  .opt:disabled{ cursor:default; }

  .feedback{ padding: 12px 14px; border-radius: 3px; font-size: 0.92rem; line-height:1.5; display:none; }
  .feedback.show{ display:block; }
  .feedback.ok{ background:#dcead9; border-left:4px solid var(--forest); }
  .feedback.bad{ background:#f2d9d9; border-left:4px solid var(--crimson); }

  .footer-row{ display:flex; justify-content:flex-end; gap:10px; margin-top:auto; padding-top:8px; }
  .center{ text-align:center; }
  .badge-grid{ display:flex; flex-wrap:wrap; gap:10px; margin: 14px 0; }
  .badge{ background: var(--ink-2); color: var(--gold-2); padding: 8px 14px; border-radius: 4px; font-size:0.78rem; border: 1px solid #00000030; }
  .badge.locked{ background:#00000015; color:#0006; }
  .rank-plate{ font-family: var(--serif); font-size: 3.2rem; font-weight:700; color: var(--gold); text-shadow: 0 2px 0 #00000020; }

  @media (max-width: 620px){
    .stage{ padding: 22px 18px 16px; }
    .topbar{ flex-direction:column; align-items:flex-start; gap:10px; }
    .stat-strip{ flex-wrap:wrap; gap:12px; }
    .data-table{ font-size:0.72rem; }
  }
</style>
</head>
<body>
<div id="app"><div class="journal" id="journal"></div></div>

<script>
/* ============ DATA SOAL — diambil & disusun dari materi Data Analisis Administrasi ============ */
const QUESTION_BANK = {
  bab1: {
    title: "Permintaan 1 — Membaca Peta Spreadsheet",

    intro: "Pagi ini Pimpinan memanggilmu ke ruangannya. \"Sebelum saya percayakan laporan penting, saya perlu tahu kamu benar-benar paham struktur spreadsheet kita,\" katanya sambil menunjuk layar komputer.",
    memo: "\"Tunjukkan bahwa kamu bisa membaca kolom, baris, cell, dan range dengan tepat.\"",
    questions: [
      { q: "Pada spreadsheet, huruf A, B, C, D yang berada di bagian atas menunjukkan …", options: ["Baris","Kolom","Cell","Rumus","Range"], correct: 1, expl: "Huruf di bagian atas spreadsheet menandai kolom." },
      { q: "Pada spreadsheet, angka 1, 2, 3, 4 yang berada di bagian kiri menunjukkan …", options: ["Kolom","Cell","Range","Baris","Rumus"], correct: 3, expl: "Angka di sisi kiri menandai baris." },
      { q: "Jika kolom F bertemu dengan baris 8, alamat cell yang terbentuk adalah …", options: ["8F","F8","F-8","F:8","8-F"], correct: 1, expl: "Alamat cell ditulis kolom lalu baris tanpa spasi: F8." },
      { q: "Seorang siswa menyebut C5 sebagai alamat kolom. Pernyataan tersebut …", options: ["Benar, C menunjukkan kolom","Benar, 5 menunjukkan kolom","Salah, C5 menunjukkan satu cell","Salah, C5 menunjukkan satu baris","Salah, C5 menunjukkan satu range"], correct: 2, expl: "C5 adalah gabungan kolom C dan baris 5 — jadi menunjuk satu cell, bukan hanya kolom." },
      { q: "Range B2:B8 menunjukkan …", options: ["Satu baris dan tujuh kolom","Tujuh baris dan satu kolom","Dua baris dan delapan kolom","Delapan baris dan dua kolom","Dua baris dan tujuh kolom"], correct: 1, expl: "B2 sampai B8 tetap di kolom B, mencakup baris 2 hingga 8 — tujuh baris, satu kolom." },
      { q: "Range A2:C4 digunakan dalam sebuah tabel. Jumlah cell yang terdapat di dalam range tersebut adalah …", options: ["06","07","08","09","12"], correct: 3, expl: "Kolom A–C (3 kolom) × baris 2–4 (3 baris) = 9 cell." },
      { q: "Seorang siswa memilih range D3:D10. Jika ia mengatakan terdapat delapan kolom dalam range tersebut, maka …", options: ["Pernyataan benar","Pernyataan salah","Pernyataan benar jika data angka","Pernyataan benar jika data teks","Pernyataan tidak dapat diperiksa"], correct: 1, expl: "D3:D10 hanya mencakup satu kolom (D) dengan delapan baris, bukan delapan kolom." }
    ]
  },
  bab2: {
    title: "Permintaan 2 — Menilai Data dengan Jernih",
    boss: { name: "Pimpinan", title: "Membawa beberapa kasus yang membingungkan tim lain", sigil: "🧭" },
    intro: "\"Kemarin ada staf lain yang buru-buru menyimpulkan sesuatu dari data, dan itu hampir membuat kita salah ambil keputusan,\" ujar Pimpinan sambil menyodorkan beberapa kasus.",
    memo: "\"Saya ingin kamu menilai setiap kasus ini secara objektif, bukan buru-buru menyimpulkan.\"",
    questions: [
      { q: "Sebuah perusahaan menemukan bahwa seorang karyawan memiliki tingkat kehadiran tinggi, tetapi jumlah pekerjaan yang diselesaikan relatif rendah. Seorang staf langsung menyimpulkan karyawan tersebut tidak produktif. Penilaian yang paling tepat terhadap kesimpulan tersebut adalah …", options: ["Tepat karena kehadiran selalu menentukan produktivitas","Tepat karena jumlah pekerjaan menjadi satu-satunya ukuran","Kurang tepat karena produktivitas memerlukan indikator tambahan","Salah karena data absensi tidak dapat digunakan sama sekali","Salah karena produktivitas hanya ditentukan oleh jam kerja"], correct: 2, expl: "Produktivitas tidak bisa disimpulkan hanya dari satu indikator — perlu data pendukung lain sebelum menarik kesimpulan." },
      { q: "Sebuah tabel pegawai memiliki kolom: NIP | Nama | Jabatan | Gaji. Ketika tabel diurutkan berdasarkan gaji dari terbesar ke terkecil, staf hanya melakukan sort pada kolom Gaji. Akibat yang paling mungkin terjadi adalah …", options: ["Nilai gaji otomatis berubah","Nama dan NIP tetap mengikuti pegawai masing-masing","Data pegawai menjadi tidak sinkron dengan nilai gajinya","Spreadsheet otomatis membuat backup","Semua data berubah menjadi alfabetis"], correct: 2, expl: "Mengurutkan hanya satu kolom membuat baris data pegawai tidak lagi selaras dengan gaji yang benar." },
      { q: "Seorang kepala administrasi meminta laporan \"10 pegawai dengan absensi terbaik\". Staf menggunakan fungsi MAX dan mengambil nilai terbesar saja. Apakah metode tersebut sudah tepat?", options: ["Ya, karena MAX menemukan data terbaik","Ya, karena hanya nilai terbesar yang diperlukan","Tidak, karena diperlukan pengurutan atau fungsi yang dapat mengidentifikasi beberapa pegawai dengan nilai tertinggi","Tidak, karena MAX hanya bekerja pada teks","Ya, selama jumlah pegawai kurang dari 10"], correct: 2, expl: "MAX hanya mengambil satu nilai tertinggi, padahal yang dibutuhkan adalah sepuluh pegawai teratas — perlu sort atau fungsi lain." },
      { q: "Seorang administrator menemukan total penjualan pada spreadsheet Rp850 juta, sedangkan laporan sistem perusahaan menunjukkan Rp780 juta. Langkah pertama yang paling ilmiah sebelum menyatakan salah satu laporan salah adalah …", options: ["Memilih angka yang lebih besar","Memeriksa sumber data, periode, duplikasi, filter, dan formula yang digunakan","Menghapus spreadsheet","Menggunakan angka sistem tanpa pemeriksaan","Mengubah semua data agar sama"], correct: 1, expl: "Sebelum menuding salah satu sumber keliru, analis harus menelusuri kemungkinan penyebab selisih terlebih dahulu." }
    ]
  },
  bab3: {
    title: "Permintaan 3 — Mengolah Tabel Penjualan",
    boss: { name: "Pimpinan", title: "Menyerahkan satu tabel penjualan nyata untuk diolah", sigil: "🧮" },
    intro: "Pimpinan meletakkan satu lembar data penjualan di mejamu. \"Ini data mentah dari empat toko kita. Saya butuh beberapa angka spesifik dari sini, cepat dan tepat.\"",
    memo: "\"Gunakan rumus yang tepat — jangan sampai satu kolom saja bisa membuat laporan kita meleset.\"",
    table: {
      headers: ["Kolom","A: NO","B: ID","C: Date","D: Toko","E: Nama","F: Produk","G: Categori","H: Jumlah","I: Satuan","J: Metode","K: Total"],
      rows: [
        ["Baris 2","1","RX-712157","08 Jun","Sejahtera","Rudi Wijaya","Roti Tawar","Makanan","3","20500","Tunai","61500"],
        ["Baris 3","2","RX-81430","10 Jun","Barokah","Yudi Markona","Beras Pinpin","Sembako","11","15500","OVO","170500"],
        ["Baris 4","3","RX-790378","12 Jun","Anugrah","Lukman Hidayat","Rokok Surya","Rokok","16","28500","TF BCA","456000"],
        ["Baris 5","4","RX-265337","12 Jun","Cahaya Suhada","Anis 20","Paket Data","Pulsa","1","20500","Tunai","20500"]
      ]
    },
    questions: [
      { q: "Dalam laporan keuangan, seorang staf menggunakan: =SUM(B2:B10), namun terdapat beberapa sel kosong dan teks \"N/A\". Staf khawatir hasil perhitungan menjadi salah. Analisis yang paling tepat adalah …", options: ["SUM selalu menghasilkan error jika terdapat teks","SUM hanya menghitung nilai numerik sehingga teks diabaikan","SUM tidak dapat digunakan pada data yang memiliki sel kosong","SUM mengubah semua teks menjadi nol secara permanen","SUM hanya menghitung angka pada baris pertama"], correct: 1, expl: "SUM secara otomatis mengabaikan sel kosong maupun teks, dan tetap menjumlahkan nilai numerik yang ada." },
      { q: "Staf tersebut menggunakan rumus =SUM(H2:K5) pada Tabel Penjualan, namun tidak sesuai harapan. Rumus yang paling tepat untuk menghitung total penjualan (kolom Total) adalah …", options: ["=SUM(H2:H5)","=SUMPRODUCT(H2:H5)","=PRODUCT(K2:K5)","=SUM(K2:K5)","=AVERAGE(H2:K5)"], correct: 3, expl: "Kolom Total ada di K, jadi total penjualan dihitung dengan =SUM(K2:K5), bukan menjumlah beberapa kolom sekaligus." },
      { q: "Staf menyimpulkan rata-rata penjualan pada Tabel Penjualan sebesar 456000 karena angka itu paling besar. Kesalahan kesimpulan tersebut adalah …", options: ["456000 merupakan nilai minimum","456000 merupakan nilai maksimum","456000 merupakan jumlah seluruh nilai","456000 merupakan jumlah total nilai penjualan","456000 merupakan rata-rata penjualan"], correct: 1, expl: "456000 adalah nilai tertinggi (maksimum) pada kolom Total, bukan rata-ratanya." },
      { q: "Seorang staf ingin mengetahui total penjualan, tetapi menggunakan AVERAGE. Kesalahan yang terjadi adalah …", options: ["AVERAGE mencari nilai terbesar","AVERAGE mencari nilai terkecil","AVERAGE menghitung nilai rata-rata","AVERAGE menghitung jumlah cell","AVERAGE menyaring data"], correct: 2, expl: "AVERAGE menghasilkan rata-rata, bukan jumlah total — fungsi yang salah untuk kebutuhan itu." },
      { q: "Dengan data pada Tabel Penjualan, rumus =AVERAGE(K2:K5) menghasilkan …", options: ["177125","456000","708500","626500","04"], correct: 0, expl: "Total keempat nilai (61500+170500+456000+20500=708500) dibagi 4 baris = 177125." },
      { q: "Dengan data pada Tabel Penjualan, rumus =COUNTA(E2:E5) menghasilkan …", options: ["177125","456000","708500","04","05"], correct: 3, expl: "COUNTA menghitung jumlah sel berisi data (bukan menjumlah nilainya) — kolom Nama terisi di 4 baris, hasilnya 04." },
      { q: "Seorang staf ingin mengetahui jumlah toko yang datanya sudah dimasukkan pada Tabel Penjualan, bukan jumlah total nilai penjualan. Fungsi yang paling sesuai adalah …", options: ["SUM","MAX","FILTER","AVERAGE","COUNTA"], correct: 4, expl: "COUNTA menghitung banyaknya sel yang terisi data — cocok untuk menghitung jumlah toko yang tercatat." },

      { q: "Dengan data pada Tabel Penjualan, cell F3 adalah data …", options: ["Nama","Sembako","Yudi Markona","Sejahtera","Beras Pinpin"], correct: 4, expl: "F adalah kolom Produk, baris 3 adalah data toko Barokah — isinya \"Beras Pinpin\"." }

  bab4: {
    title: "Permintaan 4 — Menelusuri dan Menyaring Data",
    boss: { name: "Pimpinan", title: "Butuh data spesifik dari ribuan baris tanpa mengubah data asli", sigil: "🔎" },

    memo: "\"Tunjukkan kamu tahu kapan harus menyaring, dan kapan harus mencocokkan data antar tabel.\"",
    questions: [

      { q: "\"Seorang guru menggunakan MIN untuk mengetahui nilai tertinggi siswa.\" Perbaikan yang seharusnya dilakukan adalah mengganti fungsi tersebut dengan …", options: ["SUM","MAX","COUNTA","FILTER","AVERAGE"], correct: 1, expl: "Untuk mencari nilai tertinggi, fungsi yang tepat adalah MAX, bukan MIN." },

    intro: "Pimpinan menunjukkan layar berisi data yang berantakan. \"Sebelum data ini dipakai untuk laporan resmi, saya ingin tahu apakah kamu bisa mengenali masalahnya.\"",
    memo: "\"Data yang rapi di permukaan belum tentu data yang benar.\"",
    questions: [
      { q: "Sebuah kantor menyimpan data pegawai pada Microsoft Excel. Data transaksi administrasi yang berjumlah ribuan baris perlu dicari berdasarkan ID pegawai, sedangkan beberapa pengguna juga harus dapat mengolah data secara bersamaan. Kombinasi pertimbangan yang paling sesuai adalah …", options: ["Excel untuk analisis dan Google Sheets untuk kolaborasi","Access untuk grafik dan Excel untuk penyimpanan sementara","Google Sheets untuk rumus dan Access untuk membuat presentasi","Excel untuk database dan Access untuk membuat grafik","Access untuk kolaborasi dan Excel untuk menyimpan dokumen"], correct: 0, expl: "Excel kuat untuk analisis dan rumus, sementara Google Sheets unggul untuk kolaborasi banyak pengguna secara bersamaan." },
      { q: "Ketika dalam sebuah tabel, record terdapat data yang kosong dan redundant (ganda), tindakan paling tepat untuk dilakukan adalah …", options: ["Menyalin semua data ganda ke data yang kosong","Menghapus data ganda dan memeriksa nilai yang kosong","Memeriksa data yang kosong dan menyalin data yang ganda","Menghapus semua baris yang terdapat record kosong","Membuat grafik sebelum melakukan cetak ganda di record yang kosong"], correct: 1, expl: "Data ganda perlu dihapus, sementara data kosong perlu diperiksa dulu penyebabnya sebelum diputuskan tindakannya." },
      { q: "Seorang staf menemukan data alamat pelanggan ditulis dengan variasi seperti \"Jl. Ahmad Yani No. 10\" dan \"Jl Ahmad Yani No 10\" yang sebenarnya merujuk alamat yang sama. Masalah utama pada data tersebut adalah …", options: ["Data tidak memiliki nomor identitas","Format penulisan belum konsisten","Jumlah data tidak mencukupi","Tipe data seluruhnya berupa angka","Struktur tabel belum memiliki grafik"], correct: 1, expl: "Inti masalahnya adalah inkonsistensi format penulisan, bukan jumlah atau jenis datanya." },
      { q: "Dalam data pegawai terdapat beberapa cell kosong pada kolom Nomor Telepon. Seorang staf langsung mengisi semua cell kosong dengan angka 0. Tindakan tersebut sebaiknya …", options: ["Dipertahankan karena kosong berarti nol","Dilanjutkan agar seluruh tabel terisi","Diganti dengan angka acak untuk sementara","Dihapus bersama seluruh baris pegawai","Diperiksa karena kosong belum tentu berarti nol"], correct: 4, expl: "Cell kosong bisa berarti data belum tersedia, bukan otomatis bernilai nol — perlu diperiksa lebih dulu." }
    ]
  },
  bab6: {
    title: "Permintaan 6 — Meringkas untuk Rapat Pimpinan",
    boss: { name: "Pimpinan", title: "Butuh ringkasan siap tayang untuk rapat mingguan", sigil: "📊" },
    intro: "\"Rapat pukul dua siang, dan saya tidak mau melihat ribuan baris data mentah di layar,\" kata Pimpinan sambil melirik jam. \"Saya butuh ringkasan yang bisa langsung dibaca.\"",
    memo: "\"Ringkas, tepat sasaran, dan enak dilihat — itu yang saya minta.\"",
    questions: [
      { q: "Sebuah perusahaan memiliki 5.000 data transaksi. Setiap minggu kepala administrasi meminta laporan total penjualan berdasarkan cabang dan bulan. Saat ini staf menghitungnya secara manual sehingga membutuhkan waktu lama. Solusi yang paling efektif adalah …", options: ["Menyalin data setiap minggu ke file baru","Mengurutkan data lalu menghitung secara manual","Membuat Pivot Table dari sumber data transaksi","Menghapus transaksi lama setelah laporan dibuat","Membuat grafik sebelum mengelompokkan data"], correct: 2, expl: "Pivot Table bisa meringkas ribuan baris data secara otomatis berdasarkan kategori yang dipilih." },
      { q: "Kepala administrasi menerima laporan penjualan lima cabang selama enam bulan. Ia ingin mengetahui cabang mana yang memiliki penjualan tertinggi dan membandingkan performa antar-cabang. Jenis grafik yang paling sesuai adalah …", options: ["Diagram garis","Diagram batang","Diagram lingkaran","Diagram pencar","Diagram radar"], correct: 1, expl: "Diagram batang paling jelas untuk membandingkan besaran antar-kategori seperti cabang." },
      { q: "Setiap akhir bulan, staf harus membuat laporan dari data transaksi baru dengan menyalin data secara manual, menghitung ulang, lalu membuat grafik. Agar proses lebih efisien, rancangan yang paling tepat adalah …", options: ["Membuat file baru untuk setiap periode","Menyimpan hasil laporan dalam bentuk PDF","Menyiapkan sumber data, rumus, dan grafik yang dapat diperbarui","Menghapus data lama sebelum memasukkan transaksi baru","Membuat laporan setelah seluruh data dicetak"], correct: 2, expl: "Sumber data, rumus, dan grafik yang saling terhubung akan otomatis memperbarui laporan tanpa perlu diulang dari nol." },
      { q: "Sebuah perusahaan memiliki ribuan transaksi dengan kolom Tanggal, Cabang, Produk, dan Total Penjualan. Manajer meminta ringkasan total penjualan setiap cabang tanpa menghitung transaksi satu per satu. Fitur yang paling sesuai adalah …", options: ["Find","Sort","Pivot Table","Spell Check","Page Layout"], correct: 2, expl: "Pivot Table langsung meringkas total per kategori tanpa perlu menghitung manual satu per satu." },
      { q: "Sebuah Pivot Table menampilkan total penjualan berdasarkan cabang. Manajer kemudian meminta laporan berdasarkan cabang dan bulan. Perubahan yang paling sesuai adalah …", options: ["Menambahkan Bulan sebagai kategori analisis","Menghapus seluruh data berdasarkan cabang","Mengubah semua angka menjadi teks","Mengganti Pivot Table dengan Word","Menghapus kolom tanggal dari sumber data"], correct: 0, expl: "Cukup menambahkan Bulan sebagai kategori baru dalam Pivot Table, tanpa perlu mengubah struktur lain." },
      { q: "Manajer memiliki data penjualan bulanan selama satu tahun dan ingin mengetahui apakah penjualan cenderung naik atau turun dari waktu ke waktu. Grafik yang paling sesuai adalah …", options: ["Pie Chart","Bar Chart","Line Chart","Scatter Chart","Doughnut Chart"], correct: 2, expl: "Line Chart paling tepat untuk menunjukkan tren perubahan suatu nilai sepanjang waktu." },
      { q: "Sebuah dashboard administrasi menampilkan 15 grafik sekaligus, dan Pimpinan justru kesulitan menemukan informasi penting. Evaluasi yang paling tepat adalah …", options: ["Dashboard terlalu banyak menggunakan data","Dashboard perlu menampilkan informasi yang relevan","Dashboard harus menggunakan lebih banyak grafik","Dashboard sebaiknya menghapus seluruh angka","Dashboard tidak perlu menggunakan data aktual"], correct: 1, expl: "Dashboard yang baik menonjolkan informasi relevan, bukan sekadar menampilkan grafik sebanyak-banyaknya." },
      { q: "Setiap minggu staf membuat laporan dengan tahapan: data baru → menghitung ulang → membuat tabel → membuat grafik → mencetak laporan, yang memakan waktu lama karena dilakukan berulang. Solusi yang paling sesuai adalah …", options: ["Menambah jumlah staf yang membuat laporan","Mengurangi jumlah transaksi yang dianalisis","Membuat template laporan yang terhubung dengan data","Mencetak data sebelum melakukan perhitungan","Menyimpan setiap laporan dalam file berbeda"], correct: 2, expl: "Template yang terhubung langsung dengan data akan memperbarui laporan otomatis tanpa mengulang seluruh proses." }
    ]
  },
  bab7: {
    title: "Permintaan 7 — Mengambil Keputusan Berbasis Data",
    boss: { name: "Pimpinan", title: "Meminta rekomendasi tindakan, bukan sekadar angka", sigil: "🧠" },
    intro: "Di penghujung hari, Pimpinan duduk sambil menutup laptopnya. \"Angka-angka itu penting, tapi saya butuh kamu menerjemahkannya menjadi keputusan.\"",
    memo: "\"Ini permintaan terakhir hari ini — dan yang paling menentukan.\"",
    questions: [
      { q: "Bagian administrasi mencatat data absensi karyawan selama enam bulan. Setelah dianalisis, terlihat bahwa jumlah keterlambatan meningkat setiap hari Senin. Tindakan yang paling sesuai berdasarkan data tersebut adalah …", options: ["Menghapus data hari Senin","Membandingkan pola absensi antarhari","Mengurangi jumlah hari kerja","Mengganti sistem penggajian","Mengabaikan data keterlambatan"], correct: 1, expl: "Langkah lanjutan yang tepat adalah menyelidiki pola tersebut lebih lanjut, misalnya membandingkannya dengan hari lain." },
      { q: "Data inventaris kantor menunjukkan penggunaan kertas rata-rata 20 rim per bulan, sementara stok saat ini hanya tersisa 5 rim dan proses pemesanan butuh beberapa hari. Keputusan administrasi yang paling rasional adalah …", options: ["Mempertimbangkan pemesanan stok berikutnya","Menunggu sampai stok benar-benar habis","Mengurangi pencatatan penggunaan kertas","Mengganti seluruh dokumen menjadi digital","Menghapus data penggunaan bulan sebelumnya"], correct: 0, expl: "Dengan stok menipis dan waktu pemesanan yang perlu diperhitungkan, langkah rasionalnya adalah mulai mempertimbangkan pemesanan berikutnya." },
      { q: "Bagian administrasi mencatat pengeluaran operasional setiap bulan. Kepala kantor ingin mengetahui pos pengeluaran yang paling besar agar dapat mengevaluasi penggunaan anggaran. Data yang paling membantu untuk kebutuhan tersebut adalah …", options: ["Nama pegawai dan jabatannya","Jenis pengeluaran dan jumlahnya","Nomor surat dan tanggal surat","Alamat kantor dan nomor telepon","Nama pemasok dan alamat pemasok"], correct: 1, expl: "Untuk mengevaluasi pos anggaran terbesar, data yang relevan adalah jenis pengeluaran beserta jumlahnya." },
      { q: "Sebelumnya staf membutuhkan waktu tiga jam setiap akhir bulan untuk membuat rekap pengeluaran. Setelah menggunakan spreadsheet dengan rumus dan template otomatis, pekerjaan tersebut selesai dalam 30 menit. Kesimpulan yang paling tepat adalah …", options: ["Spreadsheet menggantikan seluruh pekerjaan staf","Keputusan perusahaan dapat dibuat tanpa analisis","Data keuangan tidak perlu diperiksa kembali","Semua laporan dapat dibuat tanpa sumber data","Otomatisasi dapat mengurangi pekerjaan berulang"], correct: 4, expl: "Contoh ini menunjukkan bagaimana otomatisasi mempercepat pekerjaan berulang, bukan menggantikan peran staf sepenuhnya." }
    ]
  }
};

const BAB_ORDER = ["bab1","bab2","bab3","bab4","bab5","bab6","bab7"];
const BAB_SKILL_LABEL = {
  bab1: "Struktur Spreadsheet",
  bab2: "Interpretasi Data",
  bab3: "Rumus Tabel Penjualan",
  bab4: "Filter & VLOOKUP",
  bab5: "Kualitas Data",
  bab6: "Pivot Table & Visualisasi",
  bab7: "Keputusan Berbasis Data"
};

/* ============ STATE ============ */
let state = {
  name: "", babIndex: 0, qIndex: 0,
  hp: 100, maxHp: 100,
  trust: 0, maxTrust: 100,
  exp: 0, level: 1,
  correctTotal: 0, totalQuestions: 0,
  babQuestions: [], answered: false,
  earnedBadges: []
};

const journal = document.getElementById('journal');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}
function shuffledQuestion(qObj){
  const optIdx = qObj.options.map((opt,i)=>({opt,i}));
  const shuffledOpts = shuffle(optIdx);
  return { q: qObj.q, expl: qObj.expl, options: shuffledOpts.map(o=>o.opt), correct: shuffledOpts.findIndex(o=>o.i === qObj.correct) };
}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============ SCREENS ============ */
function renderIntro(){
  state.totalQuestions = BAB_ORDER.reduce((sum,k)=>sum+QUESTION_BANK[k].questions.length,0);
  journal.innerHTML = `
    <div class="stage center">
      <span class="chip">Simulasi Kerja — Data Analisis Administrasi</span>
      <h1>Permintaan Pimpinan</h1>
      <p class="lede">Satu hari kerja sebagai staf administrasi, dilihat lewat tujuh permintaan data dari Pimpinan.</p>
      <hr class="rule">
      <p>Kamu adalah staf administrasi. Sepanjang hari ini, Pimpinan akan mendatangi mejamu tujuh kali — masing-masing dengan permintaan data yang berbeda. Caramu menjawab akan menentukan seberapa besar kepercayaan yang ia berikan padamu.</p>
      <p>Jawaban yang tepat akan menaikkan kepercayaan Pimpinan. Jawaban yang meleset akan menguras energi kerjamu. Jaga keduanya sampai akhir hari.</p>
      <p style="margin-top:18px;">Siapa namamu?</p>
      <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:6px;">
        <input type="text" id="nameInput" placeholder="Tulis namamu di sini" maxlength="24">
      </div>
      <div class="footer-row" style="justify-content:center; margin-top:18px;">
        <button class="btn" id="startBtn">Mulai Hari Kerja →</button>
      </div>
    </div>
  `;
  const input = document.getElementById('nameInput');
  const go = () => { state.name = input.value.trim() || "Staf"; startBab(0); };
  document.getElementById('startBtn').onclick = go;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
  input.focus();
}

function startBab(index){
  state.babIndex = index;
  state.qIndex = 0;
  state.trust = 0;
  const babKey = BAB_ORDER[index];
  const bab = QUESTION_BANK[babKey];
  state.babQuestions = shuffle(bab.questions).map(shuffledQuestion);
  renderBabIntro();
}

function topbar(){
  const babKey = BAB_ORDER[state.babIndex];
  const bab = QUESTION_BANK[babKey] || {title:"—"};
  return `
    <div class="topbar">
      <div>
        <div class="brand"><b>${escapeHtml(state.name)}</b> · Staf Administrasi</div>
        <div style="font-size:0.75rem; opacity:0.75; margin-top:2px;">${bab.title || ""}</div>
      </div>
      <div class="stat-strip">
        <div class="hpwrap">
          <div class="barlabel">ENERGI KERJA</div>
          <div class="barouter"><div class="barinner energi" style="width:${Math.max(state.hp,0)}%"></div></div>
        </div>
        <div class="hpwrap">
          <div class="barlabel">LV.${state.level}</div>
          <div class="barouter"><div class="barinner exp" style="width:${state.exp % 100}%"></div></div>
        </div>
      </div>
    </div>
  `;
}

function renderBabIntro(){
  const babKey = BAB_ORDER[state.babIndex];
  const bab = QUESTION_BANK[babKey];
  journal.innerHTML = `
    ${topbar()}
    <div class="stage">
      <span class="chip">Permintaan ${state.babIndex+1} dari ${BAB_ORDER.length}</span>
      <h1>${bab.title}</h1>
      <p>${bab.intro}</p>
      <div class="boss-card">
        <div class="boss-sigil">${bab.boss.sigil}</div>
        <div>
          <div class="boss-name">${bab.boss.name}</div>
          <div class="boss-title">${bab.boss.title}</div>
        </div>
      </div>
      <div class="memo">${bab.memo}</div>
      <div class="footer-row">
        <button class="btn" id="enterBtn">Tanggapi Permintaan →</button>
      </div>
    </div>
  `;
  document.getElementById('enterBtn').onclick = ()=> renderQuestion();
}

function renderQuestion(){
  state.answered = false;
  const babKey = BAB_ORDER[state.babIndex];
  const bab = QUESTION_BANK[babKey];
  const q = state.babQuestions[state.qIndex];

  let tableHtml = "";
  if(state.qIndex === 0 && bab.table){
    tableHtml = `
      <div class="scene-desk">
        <div style="font-size:0.8rem; color:var(--ink-soft); margin-bottom:4px;">Lembar Data — Tabel Penjualan (dipakai untuk beberapa pertanyaan berikut)</div>
        <table class="data-table">
          <tr>${bab.table.headers.map(h=>`<th>${h}</th>`).join('')}</tr>
          ${bab.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}
        </table>
      </div>
    `;
  }

  journal.innerHTML = `
    ${topbar()}
    <div class="stage">
      <div class="boss-card">
        <div class="boss-sigil">${bab.boss.sigil}</div>
        <div style="flex:1;">
          <div class="boss-name">Tingkat Kepercayaan Pimpinan</div>
          <div class="hpwrap" style="width:100%; margin-top:6px;">
            <div class="barouter"><div class="barinner trust" style="width:${Math.max(state.trust,0)}%"></div></div>
          </div>
        </div>
      </div>
      <div class="qcount">Pertanyaan ${state.qIndex+1} dari ${state.babQuestions.length}</div>
      ${tableHtml}
      <h2>${q.q}</h2>
      <div class="options" id="optionsWrap">
        ${q.options.map((opt,i)=>`<button class="opt" data-i="${i}">${opt}</button>`).join('')}
      </div>
      <div class="feedback" id="feedback"></div>
      <div class="footer-row">
        <button class="btn" id="nextBtn" style="display:none;">Lanjut →</button>
      </div>
    </div>
  `;
  document.querySelectorAll('.opt').forEach(btn=>{
    btn.onclick = () => handleAnswer(parseInt(btn.dataset.i), q);
  });
}

function handleAnswer(choice, q){
  if(state.answered) return;
  state.answered = true;
  const buttons = document.querySelectorAll('.opt');
  buttons.forEach(b=>b.disabled = true);

  const correct = choice === q.correct;
  buttons[q.correct].classList.add('correct');
  if(!correct) buttons[choice].classList.add('wrong');

  const fb = document.getElementById('feedback');
  fb.classList.add('show', correct ? 'ok' : 'bad');
  fb.textContent = (correct ? "Tepat. " : "Belum tepat. ") + q.expl;

  const trustGain = Math.ceil(100 / state.babQuestions.length);
  if(correct){
    state.trust = Math.min(100, state.trust + trustGain);
    state.exp += 15;
    state.correctTotal += 1;
    if(state.exp >= state.level * 100){ state.level += 1; }
  } else {
    state.hp = Math.max(0, state.hp - 12);
  }

  document.querySelector('.barinner.trust').style.width = Math.max(state.trust,0) + '%';
  document.querySelector('.barinner.energi').style.width = Math.max(state.hp,0) + '%';
  document.querySelector('.barinner.exp').style.width = (state.exp % 100) + '%';

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.style.display = 'inline-block';
  nextBtn.onclick = advance;
}

function advance(){
  if(state.hp <= 0){ renderDefeat(); return; }
  state.qIndex += 1;
  if(state.qIndex < state.babQuestions.length){
    renderQuestion();
  } else {
    state.earnedBadges.push(BAB_ORDER[state.babIndex]);
    renderBabVictory();
  }
}

function renderBabVictory(){
  const babKey = BAB_ORDER[state.babIndex];
  const bab = QUESTION_BANK[babKey];
  const isLast = state.babIndex === BAB_ORDER.length - 1;
  journal.innerHTML = `
    ${topbar()}
    <div class="stage center">
      <span class="chip">Permintaan Selesai</span>
      <h1>Pimpinan mengangguk puas</h1>
      <p class="lede">Kamu kini menguasai: <b>${BAB_SKILL_LABEL[babKey]}</b></p>
      <div class="badge-grid" style="justify-content:center;">
        ${state.earnedBadges.map(k=>`<div class="badge">${BAB_SKILL_LABEL[k]}</div>`).join('')}
      </div>
      <div class="footer-row" style="justify-content:center;">
        <button class="btn" id="continueBtn">${isLast ? "Lihat Evaluasi Akhir Hari →" : "Tunggu Permintaan Berikutnya →"}</button>
      </div>
    </div>
  `;
  document.getElementById('continueBtn').onclick = () => {
    if(isLast){ renderFinalResult(); } else { startBab(state.babIndex + 1); }
  };
}

function renderDefeat(){
  journal.innerHTML = `
    ${topbar()}
    <div class="stage center">
      <span class="chip">Energi Kerja Habis</span>
      <h1>Kamu perlu istirahat sejenak, ${escapeHtml(state.name)}</h1>
      <p class="lede">Terlalu banyak jawaban meleset membuat energi kerjamu terkuras. Staf administrasi yang baik tahu kapan harus jeda dan mencoba lagi dengan kepala dingin.</p>
      <p>Progres benar sejauh ini: <b>${state.correctTotal} dari ${state.totalQuestions}</b> pertanyaan.</p>
      <div class="footer-row" style="justify-content:center;">
        <button class="btn" id="retryBtn">Coba Lagi dari Awal</button>
      </div>
    </div>
  `;
  document.getElementById('retryBtn').onclick = resetGame;
}

function renderFinalResult(){
  const pct = Math.round((state.correctTotal / state.totalQuestions) * 100);
  let rank, ranktext;
  if(pct >= 90){ rank="S"; ranktext="Pimpinan menyerahkan laporan penting berikutnya langsung padamu tanpa ragu."; }
  else if(pct >= 75){ rank="A"; ranktext="Pimpinan puas — data yang kamu olah jarang perlu direvisi."; }
  else if(pct >= 60){ rank="B"; ranktext="Pimpinan cukup percaya, meski beberapa jawabanmu masih perlu dipertajam."; }
  else { rank="C"; ranktext="Pimpinan menyarankan kamu berlatih lagi sebelum memegang laporan penting."; }

  journal.innerHTML = `
    <div class="stage center">
      <span class="chip">Evaluasi Akhir Hari</span>
      <h1>Hari Kerja ${escapeHtml(state.name)} Berakhir</h1>
      <div class="rank-plate">${rank}</div>
      <p class="lede">${ranktext}</p>
      <hr class="rule">
      <p>Jawaban benar: <b>${state.correctTotal} / ${state.totalQuestions}</b> (${pct}%)&nbsp;·&nbsp; Level akhir: <b>${state.level}</b></p>
      <h2 style="margin-top:12px;">Kemampuan yang Dikuasai</h2>
      <div class="badge-grid" style="justify-content:center;">
        ${BAB_ORDER.map(k=>{
          const earned = state.earnedBadges.includes(k);
          return `<div class="badge ${earned ? '' : 'locked'}">${BAB_SKILL_LABEL[k]}</div>`;
        }).join('')}
      </div>
      <div class="footer-row" style="justify-content:center;">
        <button class="btn secondary" id="restartBtn">Ulangi dari Awal</button>
      </div>
    </div>
  `;
  document.getElementById('restartBtn').onclick = resetGame;
}

function resetGame(){
  state = {
    name: state.name, babIndex: 0, qIndex: 0,
    hp: 100, maxHp: 100, trust: 0, maxTrust: 100,
    exp: 0, level: 1, correctTotal: 0, totalQuestions: 0,
    babQuestions: [], answered: false, earnedBadges: []
  };
  renderIntro();
}

renderIntro();
</script>
</body>
</html>
