.cm{color:#7f95a3}

code{font:13px ui-monospace,Menlo,Consolas,monospace;background:var(--bd);padding:0 5px;border-radius:4px}
li{margin:6px 0}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--bd);padding:6px 8px;text-align:left}

button:disabled{cursor:not-allowed}

function pet(){const s=S[cur];
if(s.tp=='e'){hs.e=(hs.e||0)+1;if(hs.e==1){sk=Math.max(20,sk-10);$('#msg').textContent='💡 Kerangka: '+s.o.map((x,i)=>`${i+1}) ${x}`).join('; ')}
else{sk=Math.max(20,sk-30);$('#rv').innerHTML='<div class="card"><h2>Kode di buku paket</h2><div class="code">'+s.ref.map(l=>lineHTML(l,()=>'')).join('')+'</div></div>';$('#msg').textContent='Kode buku ditampilkan (−30). Ketik sendiri ulang, jangan ditempel.'}$('#sc').textContent=sk;return}
const e=[...document.querySelectorAll('#code input')].find(x=>!x.disabled);if(!e)return;const n=+e.dataset.n;hs[n]=(hs[n]||0)+1;ms[cur][n]=ms[cur][n]||{w:'(petunjuk)'};
if(hs[n]==1){sk=Math.max(20,sk-5);$('#msg').textContent='💡 Kotak '+(n+1)+': '+s.h[n]}else{sk=Math.max(20,sk-10);e.value=s.a[n][0];$('#msg').textContent='Jawaban kotak '+(n+1)+' diisikan. Pahami dulu, lalu tekan Periksa kode.'}$('#sc').textContent=sk;e.focus()}
function lcs(A,B){const a=A.map(nz),b=B.map(nz),n=a.length,m=b.length,L=Array.from({length:n+1},()=>Array(m+1).fill(0));
for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=a[i]==b[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
const r=[];let i=0,j=0;while(i<n&&j<m){if(a[i]==b[j]){r.push(['=',A[i],i]);i++;j++}else if(L[i+1][j]>=L[i][j+1]){r.push(['-',A[i],i]);i++}else{r.push(['+',B[j]]);j++}}
while(i<n){r.push(['-',A[i],i]);i++}while(j<m){r.push(['+',B[j]]);j++}return r}
function cekE(){const s=S[cur],t=$('#ta').value;if(!t.trim()){$('#msg').textContent='Tulis kodenya dulu di kotak.';return}ck++;
const R=s.ref,A=R.map(x=>x.trim()),B=t.split('\n').map(l=>l.replace(/\/\/.*$/,'').trim()).filter(Boolean);
const perfect=nz(A.join(''))==nz(B.join('')),ops=perfect?A.map((x,i)=>['=',x,i]):lcs(A,B),o=[];
for(let i=0;i<ops.length;){if(ops[i][0]=='='){o.push(ops[i++]);continue}const d=[],p=[];while(i<ops.length&&ops[i][0]!='='){(ops[i][0]=='-'?d:p).push(ops[i]);i++}
const k=Math.min(d.length,p.length);for(let q=0;q<k;q++)o.push(['~',d[q][1],p[q][1],d[q][2]]);for(let q=k;q<d.length;q++)o.push(d[q]);for(let q=k;q<p.length;q++)o.push(p[q])}
const eq=o.filter(x=>x[0]=='=').length,full=o.every(x=>x[0]=='=');lastAcc=eq/A.length;ms[cur]={};let c=0;
const pad=i=>`<div class="ln" style="padding-left:${R[i].length-R[i].trimStart().length}ch">`;
const h=o.map(x=>{if(x[0]=='=')return pad(x[2])+`<b class="rk">${esc(x[1])}</b></div>`;
if(x[0]=='~'){ms[cur]['L'+c++]={lbl:'baris',w:x[2],e:x[1]};return pad(x[3])+`<s class="rw">${esc(x[2])}</s> <b class="rk">${esc(x[1])}</b></div>`}
if(x[0]=='-'){ms[cur]['L'+c++]={lbl:'baris',w:'(tidak ditulis)',e:x[1]};return pad(x[2])+`<b class="rk">${esc(x[1])}</b> <span class="cm">// kurang</span></div>`}
ms[cur]['L'+c++]={lbl:'baris',w:x[1],e:'(hapus baris ini)'};return`<div class="ln"><s class="rw">${esc(x[1])}</s> <span class="cm">// kelebihan</span></div>`}).join('');
$('#rv').innerHTML=`<div class="card"><h2>Hasil penulisan ulang</h2><p class="mu">Hijau = sesuai buku. Merah dicoret = tulisanmu, hijau di sebelahnya = yang seharusnya. Komentar dan spasi diabaikan.</p><div class="code">${h}</div><p><b>${eq} dari ${A.length} baris sesuai (${Math.round(lastAcc*100)}%).</b></p>${full?'':'<div class="row"><button class="sec" onclick="kirim()">Kirim hasil akhir</button></div>'}</div>`;
if(full){sk=Math.max(20,sk-3*(ck-1));$('#sc').textContent=sk;$('#msg').textContent='Sempurna! Kodemu sama dengan buku.';done()}
else{sk=Math.max(20,sk-3);$('#sc').textContent=sk;$('#msg').textContent='Belum sama dengan buku. Perbaiki lalu periksa lagi, atau kirim hasil akhir.';$('#rv').scrollIntoView({block:'nearest',behavior:'smooth'})}}
function kirim(){sk=Math.max(10,Math.round(sk*lastAcc));$('#sc').textContent=sk;done()}
function done(){res[cur]=sk;const ta=$('#ta');if(ta)ta.readOnly=true;$('#xp').textContent=sum();$('#kp').hidden=true;const s=S[cur],c=s.t=='Pencarian';data=s.d[0].slice();tgt=s.d[1];$('#sim').hidden=false;
$('#sim').innerHTML=`<div class="card"><h2>${stars(sk)} Simulasi ${s.n}</h2>
<div class="row">${c?`<label>Target <input type="number" id="tg" value="${tgt}" onchange="regen()"></label>`:''}<button onclick="play()" id="pl">▶ Putar</button><button class="sec" onclick="stepF()">Langkah</button><button class="sec" onclick="regen()">Ulang</button><button class="sec" onclick="acak()">🎲 Data acak</button></div>
<div class="bars" id="bars"></div><div id="fm" class="mu" role="status"></div><div class="out" id="out"></div></div>
<div class="row"><button onclick="${cur<S.length-1?'openStage('+(cur+1)+')':'fin()'}">${cur<S.length-1?'Misi berikutnya':'Lihat hasil akhir'}</button></div>`;
regen();$('#sim').scrollIntoView({behavior:'smooth'})}
const cr=()=>S[cur].t=='Pencarian';
function acak(){const n=cr()?7:6;let a=[];while(a.length<n){const v=1+Math.floor(Math.random()*40);if(!a.includes(v))a.push(v)}
if(S[cur].id=='binary')a.sort((x,y)=>x-y);data=a;if(cr()){tgt=Math.random()<.5?a[Math.floor(Math.random()*n)]:41+Math.floor(Math.random()*9);$('#tg').value=tgt}regen()}
function regen(){stop();const e=$('#tg');if(e)tgt=+e.value;fr=gen(S[cur].id,data,tgt);fi=0;draw()}
function stop(){clearInterval(tm);tm=null;const b=$('#pl');if(b)b.textContent='▶ Putar'}
function play(){if(tm){stop();return}if(fi>=fr.length-1)fi=0;$('#pl').textContent='⏸ Jeda';tm=setInterval(()=>{if(fi<fr.length-1){fi++;draw()}else stop()},750)}
function stepF(){stop();if(fi<fr.length-1)fi++;draw()}
function draw(){const f=fr[fi],mx=Math.max(...f.a);let h='';
f.a.forEach((v,k)=>{const c=f.f.includes(k)?'f':f.s.includes(k)?'s':f.c.includes(k)?'c':f.d.includes(k)?'d':'',g=f.g&&k>=f.g[0]&&k<=f.g[1]?' g':'';
h+=`<div class="col"><div class="b ${c}${g}" style="height:${30+v/mx*130}px">${v}</div><small>${k} ${f.tag[k]?'· '+f.tag[k]:''}</small></div>`});
$('#bars').innerHTML=h;$('#fm').textContent=`Langkah ${fi+1} dari ${fr.length}: ${f.m}`;$('#out').textContent=f.o?'> '+f.o:'> (menunggu program selesai)'}
function gen(id,a0,t){const a=a0.slice(),n=a.length,f=[];
const P=o=>f.push(Object.assign({a:a.slice(),c:[],s:[],d:[],f:[],g:null,tag:{},m:''},o));
const T=(...p)=>{const o={};p.forEach(([i,x])=>{o[i]=o[i]?o[i]+'/'+x:x});return o};
const R=(x,y)=>{const r=[];for(let k=x;k<=y;k++)r.push(k);return r};
const out=()=>'Array terurut: ['+a.join(', ')+']';
if(id=='linear'){for(let i=0;i<n;i++){P({c:[i],tag:T([i,'i']),m:`i = ${i}, arr[${i}] = ${a[i]}. Sama dengan ${t}?`});
if(a[i]===t){P({f:[i],tag:T([i,'i']),m:`Ketemu! return ${i}`,o:`Target ditemukan di indeks: ${i}`});return f}}
P({m:'Semua elemen sudah diperiksa, return -1',o:'Target tidak ditemukan'})}
else if(id=='binary'){let lo=0,hi=n-1;while(lo<=hi){const mid=Math.floor((lo+hi)/2),g=[lo,hi];
P({g,c:[mid],tag:T([lo,'low'],[mid,'mid'],[hi,'high']),m:`low=${lo}, high=${hi}, mid=${mid}, arr[mid]=${a[mid]}`});
if(a[mid]===t){P({g,f:[mid],tag:T([mid,'mid']),m:`arr[mid] === target, return ${mid}`,o:`Target ditemukan di indeks: ${mid}`});return f}
else if(a[mid]<t){P({g,c:[mid],tag:T([mid,'mid']),m:`${a[mid]} < ${t}: target di kanan, low = ${mid+1}`});lo=mid+1}
else{P({g,c:[mid],tag:T([mid,'mid']),m:`${a[mid]} > ${t}: target di kiri, high = ${mid-1}`});hi=mid-1}}
P({m:'low > high, ruang pencarian habis, return -1',o:'Target tidak ditemukan'})}
else if(id=='selection'){for(let i=0;i<n-1;i++){let mn=i;
for(let j=i+1;j<n;j++){P({d:R(0,i-1),c:[j,mn],tag:T([i,'i'],[mn,'min'],[j,'j']),m:`Bandingkan arr[${j}]=${a[j]} dengan arr[minIndex]=${a[mn]}`});if(a[j]<a[mn])mn=j}
if(mn!==i){[a[i],a[mn]]=[a[mn],a[i]];P({d:R(0,i-1),s:[i,mn],m:`Tukar posisi ${i} dengan posisi ${mn}`})}}
P({d:R(0,n-1),m:'Selesai, semua elemen terurut',o:out()})}
else if(id=='bubble'){for(let i=0;i<n-1;i++){let sw=false;
for(let j=0;j<n-i-1;j++){P({d:R(n-i,n-1),c:[j,j+1],tag:T([j,'j'],[j+1,'j+1']),m:`Apakah arr[${j}]=${a[j]} > arr[${j+1}]=${a[j+1]}?`});
if(a[j]>a[j+1]){[a[j],a[j+1]]=[a[j+1],a[j]];sw=true;P({d:R(n-i,n-1),s:[j,j+1],m:'Ya, tukar dan swapped = true'})}}
if(!sw){P({d:R(0,n-1),m:'Tidak ada pertukaran (swapped = false), break',o:out()});return f}}
P({d:R(0,n-1),m:'Selesai, semua elemen terurut',o:out()})}
else{P({m:'Divide: array dibelah rekursif sampai 1 elemen, lalu digabung (conquer)'});
const ms2=(l,r)=>{if(l>=r)return;const m=Math.floor((l+r)/2);ms2(l,m);ms2(m+1,r);const L=a.slice(l,m+1),Q=a.slice(m+1,r+1);let i=0,j=0,k=l;
const w=v=>{a[k]=v;P({g:[l,r],s:[k],tag:T([k,'k']),m:`Gabung bagian [${l}..${r}]: tulis ${v} di posisi ${k}`});k++};
while(i<L.length&&j<Q.length)w(L[i]<=Q[j]?L[i++]:Q[j++]);while(i<L.length)w(L[i++]);while(j<Q.length)w(Q[j++])};
ms2(0,n-1);P({d:R(0,n-1),m:'Selesai, semua elemen terurut',o:out()})}
return f}
function fin(){stop();const tot=sum(),mx=S.length*100,p=Math.round(tot/mx*100);let r='',w='';
S.forEach((s,i)=>{r+=`<tr><td>${i+1}</td><td>${s.i} ${s.n}</td><td>${s.lv}</td><td>${res[i]!=null?stars(res[i])+' '+res[i]:'-'}</td></tr>`;
Object.entries(ms[i]||{}).forEach(([k,x])=>{const e=x.e||s.a[k][0];w+=`<li><b>${s.n}</b>, ${x.lbl||'kotak '+(+k+1)}: ${x.w==='(petunjuk)'?'memakai petunjuk, seharusnya':'kamu menulis <code>'+esc(x.w)+'</code>, seharusnya'} <code>${esc(e)}</code>.${x.e?'':' '+esc(s.h[k])}</li>`})});
const ket=p>=85?'Sangat baik! Penulisan kodemu sudah teliti sampai tingkat akhir.':p>=60?'Baik. Masih ada tanda baca, operator, atau baris yang perlu dilatih.':'Perlu latihan lagi. Ulangi permainan dan perhatikan tiap tanda baca.';
$('#end').innerHTML=`<h1>Hasil ${esc(nama)}</h1><div class="card"><p style="font-size:22px;margin:0"><b>${tot}</b> dari ${mx} poin (${p}%)</p><p>${ket}</p></div>
<div class="card"><h2>Yang perlu diperbaiki</h2>${w?'<ol>'+w+'</ol>':'<p>Tidak ada kesalahan penulisan. Hebat!</p>'}</div>
<div class="card"><h2>Rincian tingkat</h2><div style="overflow-x:auto"><table><tr><th>Tingkat</th><th>Algoritma</th><th>Cara menulis</th><th>Poin</th></tr>${r}</table></div>
<p class="mu">Binary search lebih cepat dari linear search, tetapi data harus terurut. Merge sort paling cepat untuk data besar, tetapi butuh memori tambahan. Selection dan bubble sort sederhana dan hemat memori, namun lambat untuk data besar.</p></div>
<div class="row"><button onclick="lain()">🎮 Game lainnya</button><button class="sec" onclick="again()">🔁 Ulangi permainan</button></div><div id="ln" class="mu"></div>`;show('end')}
function lain(){if(LINK_GAME_LAIN)window.open(LINK_GAME_LAIN,'_blank','noopener');else $('#ln').textContent='Tautan game lain belum diisi oleh guru.'}
function again(){res=[];ms={};cur=0;home()}
nameScreen();
</script></body></html>
